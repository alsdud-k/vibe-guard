# VibeGuard Security Profile
# Place this file at the repository root to configure security review behavior.
# All fields are optional — VibeGuard uses heuristic defaults when absent.

framework: fastapi
language: python
authentication: jwt

auth_patterns:
  admin: "Depends(require_admin)"
  user: "Depends(get_current_user)"

protected_paths:
  - path: "/admin"
    required_auth: admin
  - path: "/internal"
    required_auth: admin

scan_paths:
  - "backend/"
  - "app/"

exclude_paths:
  - "tests/"
  - "migrations/"
  - "node_modules/"

# suppression:
#   - id: "VIBE-001"
#     reason: "False positive — custom auth handled in middleware"
#     path: "app/api/public_health.py"
suppression: []
