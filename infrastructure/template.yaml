AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: VibeGuard - GitHub PR Security Review Service (Phase 4)

Parameters:
  SecretName:
    Type: String
    Default: vibe-guard/github-app
    Description: AWS Secrets Manager secret name for GitHub App credentials

Globals:
  Function:
    Runtime: python3.12
    Architectures:
      - x86_64
    Environment:
      Variables:
        SECRET_NAME: !Ref SecretName
        REGION: !Ref AWS::Region

Resources:

  # ──────────────────────────────────────────
  # API Gateway
  # ──────────────────────────────────────────
  VibeGuardApi:
    Type: AWS::Serverless::Api
    Properties:
      Name: vibe-guard-api
      StageName: prod
      TracingEnabled: true
      MethodSettings:
        - ResourcePath: "/*"
          HttpMethod: "*"
          ThrottlingBurstLimit: 100
          ThrottlingRateLimit: 50

  # ──────────────────────────────────────────
  # Lambda: webhook-validator
  # ──────────────────────────────────────────
  WebhookValidatorFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: vibe-guard-webhook-validator
      CodeUri: ../lambdas/webhook_validator/
      Handler: handler.lambda_handler
      MemorySize: 256
      Timeout: 15
      Role: !GetAtt WebhookValidatorRole.Arn
      Environment:
        Variables:
          WORKFLOW_ARN: !Ref VibeGuardWorkflow
          LOCK_TABLE: !Ref ExecutionLockTable
      Events:
        WebhookPost:
          Type: Api
          Properties:
            RestApiId: !Ref VibeGuardApi
            Path: /webhook
            Method: POST

  WebhookValidatorLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: /aws/lambda/vibe-guard-webhook-validator
      RetentionInDays: 14

  # ──────────────────────────────────────────
  # Lambda: pr-collector
  # ──────────────────────────────────────────
  PrCollectorFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: vibe-guard-pr-collector
      CodeUri: ../lambdas/pr_collector/
      Handler: handler.lambda_handler
      MemorySize: 512
      Timeout: 30
      Role: !GetAtt PrCollectorRole.Arn

  PrCollectorLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: /aws/lambda/vibe-guard-pr-collector
      RetentionInDays: 14

  # ──────────────────────────────────────────
  # Lambda: relevance-filter
  # ──────────────────────────────────────────
  RelevanceFilterFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: vibe-guard-relevance-filter
      CodeUri: ../lambdas/relevance_filter/
      Handler: handler.lambda_handler
      MemorySize: 256
      Timeout: 15
      Role: !GetAtt RelevanceFilterRole.Arn

  RelevanceFilterLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: /aws/lambda/vibe-guard-relevance-filter
      RetentionInDays: 14

  # ──────────────────────────────────────────
  # Lambda: context-collector
  # ──────────────────────────────────────────
  ContextCollectorFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: vibe-guard-context-collector
      CodeUri: ../lambdas/context_collector/
      Handler: handler.lambda_handler
      MemorySize: 512
      Timeout: 30
      Role: !GetAtt ContextCollectorRole.Arn

  ContextCollectorLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: /aws/lambda/vibe-guard-context-collector
      RetentionInDays: 14

  # ──────────────────────────────────────────
  # Lambda: regression-detector
  # ──────────────────────────────────────────
  RegressionDetectorFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: vibe-guard-regression-detector
      CodeUri: ../lambdas/regression_detector/
      Handler: handler.lambda_handler
      MemorySize: 512
      Timeout: 30
      Role: !GetAtt RegressionDetectorRole.Arn

  RegressionDetectorLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: /aws/lambda/vibe-guard-regression-detector
      RetentionInDays: 14

  # ──────────────────────────────────────────
  # Lambda: bedrock-reviewer
  # ──────────────────────────────────────────
  BedrockReviewerFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: vibe-guard-bedrock-reviewer
      CodeUri: ../lambdas/bedrock_reviewer/
      Handler: handler.lambda_handler
      MemorySize: 512
      Timeout: 60
      Role: !GetAtt BedrockReviewerRole.Arn

  BedrockReviewerLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: /aws/lambda/vibe-guard-bedrock-reviewer
      RetentionInDays: 14

  # ──────────────────────────────────────────
  # Lambda: semgrep-scanner
  # ──────────────────────────────────────────
  SemgrepScannerFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: vibe-guard-semgrep-scanner
      CodeUri: ../lambdas/semgrep_scanner/
      Handler: handler.lambda_handler
      MemorySize: 512
      Timeout: 60
      Role: !GetAtt SemgrepScannerRole.Arn

  SemgrepScannerLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: /aws/lambda/vibe-guard-semgrep-scanner
      RetentionInDays: 14

  # ──────────────────────────────────────────
  # Lambda: result-builder
  # ──────────────────────────────────────────
  ResultBuilderFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: vibe-guard-result-builder
      CodeUri: ../lambdas/result_builder/
      Handler: handler.lambda_handler
      MemorySize: 256
      Timeout: 15
      Role: !GetAtt ResultBuilderRole.Arn

  ResultBuilderLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: /aws/lambda/vibe-guard-result-builder
      RetentionInDays: 14

  # ──────────────────────────────────────────
  # Lambda: github-commenter
  # ──────────────────────────────────────────
  GithubCommenterFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: vibe-guard-github-commenter
      CodeUri: ../lambdas/github_commenter/
      Handler: handler.lambda_handler
      MemorySize: 256
      Timeout: 15
      Role: !GetAtt GithubCommenterRole.Arn

  GithubCommenterLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: /aws/lambda/vibe-guard-github-commenter
      RetentionInDays: 14

  # ──────────────────────────────────────────
  # Step Functions Express Workflow
  # ──────────────────────────────────────────
  VibeGuardWorkflow:
    Type: AWS::Serverless::StateMachine
    Properties:
      Name: vibe-guard-workflow
      Type: EXPRESS
      DefinitionUri: ../step_functions/workflow.asl.json
      DefinitionSubstitutions:
        PrCollectorArn: !GetAtt PrCollectorFunction.Arn
        RelevanceFilterArn: !GetAtt RelevanceFilterFunction.Arn
        ContextCollectorArn: !GetAtt ContextCollectorFunction.Arn
        RegressionDetectorArn: !GetAtt RegressionDetectorFunction.Arn
        BedrockReviewerArn: !GetAtt BedrockReviewerFunction.Arn
        SemgrepScannerArn: !GetAtt SemgrepScannerFunction.Arn
        ResultBuilderArn: !GetAtt ResultBuilderFunction.Arn
        GithubCommenterArn: !GetAtt GithubCommenterFunction.Arn
      Role: !GetAtt StepFunctionsRole.Arn
      Logging:
        Destinations:
          - CloudWatchLogsLogGroup:
              LogGroupArn: !GetAtt StepFunctionsLogGroup.Arn
        IncludeExecutionData: true
        Level: ERROR

  StepFunctionsLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: /vibe-guard/step-functions
      RetentionInDays: 14

  # ──────────────────────────────────────────
  # DynamoDB Tables
  # ──────────────────────────────────────────
  AnalysisResultsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: vibe-guard-analysis-results
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: repository
          AttributeType: S
        - AttributeName: pr_commit
          AttributeType: S
      KeySchema:
        - AttributeName: repository
          KeyType: HASH
        - AttributeName: pr_commit
          KeyType: RANGE
      TimeToLiveSpecification:
        AttributeName: ttl
        Enabled: true
      Tags:
        - Key: Project
          Value: vibe-guard

  ExecutionLockTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: vibe-guard-execution-lock
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: pr_key
          AttributeType: S
      KeySchema:
        - AttributeName: pr_key
          KeyType: HASH
      TimeToLiveSpecification:
        AttributeName: ttl
        Enabled: true
      Tags:
        - Key: Project
          Value: vibe-guard

  # ──────────────────────────────────────────
  # IAM Roles
  # ──────────────────────────────────────────
  WebhookValidatorRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: vibe-guard-webhook-validator-role
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: WebhookValidatorPolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: secretsmanager:GetSecretValue
                Resource: !Sub 'arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:vibe-guard/github-app*'
              - Effect: Allow
                Action: states:StartExecution
                Resource: !Ref VibeGuardWorkflow
              - Effect: Allow
                # Express Workflow stop is best-effort; included for forward compatibility
                Action: states:StopExecution
                Resource: !Sub 'arn:aws:states:${AWS::Region}:${AWS::AccountId}:express:vibe-guard-workflow:*'
              - Effect: Allow
                Action:
                  - dynamodb:GetItem
                  - dynamodb:PutItem
                  - dynamodb:DeleteItem
                Resource: !GetAtt ExecutionLockTable.Arn
              - Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: !Sub 'arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/vibe-guard-webhook-validator:*'

  PrCollectorRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: vibe-guard-pr-collector-role
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: PrCollectorPolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: secretsmanager:GetSecretValue
                Resource: !Sub 'arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:vibe-guard/github-app*'
              - Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: !Sub 'arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/vibe-guard-pr-collector:*'

  RelevanceFilterRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: vibe-guard-relevance-filter-role
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: RelevanceFilterPolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: !Sub 'arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/vibe-guard-relevance-filter:*'

  ContextCollectorRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: vibe-guard-context-collector-role
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: ContextCollectorPolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: secretsmanager:GetSecretValue
                Resource: !Sub 'arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:vibe-guard/github-app*'
              - Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: !Sub 'arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/vibe-guard-context-collector:*'

  RegressionDetectorRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: vibe-guard-regression-detector-role
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: RegressionDetectorPolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: !Sub 'arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/vibe-guard-regression-detector:*'

  BedrockReviewerRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: vibe-guard-bedrock-reviewer-role
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: BedrockReviewerPolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: bedrock:InvokeModel
                Resource:
                  # Wildcard region required: us.* cross-region inference profiles
                  # route across us-east-1/us-east-2/us-west-2 at runtime.
                  - 'arn:aws:bedrock:*::foundation-model/anthropic.claude-haiku*'
                  - 'arn:aws:bedrock:*::foundation-model/anthropic.claude-sonnet*'
                  - !Sub 'arn:aws:bedrock:*:${AWS::AccountId}:inference-profile/us.anthropic.claude-haiku*'
                  - !Sub 'arn:aws:bedrock:*:${AWS::AccountId}:inference-profile/us.anthropic.claude-sonnet*'
              - Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: !Sub 'arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/vibe-guard-bedrock-reviewer:*'

  SemgrepScannerRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: vibe-guard-semgrep-scanner-role
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: SemgrepScannerPolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: !Sub 'arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/vibe-guard-semgrep-scanner:*'

  ResultBuilderRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: vibe-guard-result-builder-role
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: ResultBuilderPolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: !Sub 'arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/vibe-guard-result-builder:*'

  GithubCommenterRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: vibe-guard-github-commenter-role
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: GithubCommenterPolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: secretsmanager:GetSecretValue
                Resource: !Sub 'arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:vibe-guard/github-app*'
              - Effect: Allow
                Action:
                  - dynamodb:PutItem
                Resource: !GetAtt AnalysisResultsTable.Arn
              - Effect: Allow
                Action:
                  - dynamodb:DeleteItem
                Resource: !GetAtt ExecutionLockTable.Arn
              - Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: !Sub 'arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/vibe-guard-github-commenter:*'

  StepFunctionsRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: vibe-guard-stepfunctions-role
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: states.amazonaws.com
            Action: sts:AssumeRole
            Condition:
              StringEquals:
                aws:SourceAccount: !Ref AWS::AccountId
      Policies:
        - PolicyName: StepFunctionsPolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: lambda:InvokeFunction
                Resource:
                  - !GetAtt PrCollectorFunction.Arn
                  - !GetAtt RelevanceFilterFunction.Arn
                  - !GetAtt ContextCollectorFunction.Arn
                  - !GetAtt RegressionDetectorFunction.Arn
                  - !GetAtt BedrockReviewerFunction.Arn
                  - !GetAtt SemgrepScannerFunction.Arn
                  - !GetAtt ResultBuilderFunction.Arn
                  - !GetAtt GithubCommenterFunction.Arn
              - Effect: Allow
                Action:
                  - logs:CreateLogDelivery
                  - logs:CreateLogGroup
                  - logs:CreateLogStream
                  - logs:DescribeLogGroups
                  - logs:DescribeLogStreams
                  - logs:DescribeResourcePolicies
                  - logs:GetLogDelivery
                  - logs:ListLogDeliveries
                  - logs:PutLogEvents
                  - logs:PutResourcePolicy
                  - logs:UpdateLogDelivery
                Resource: "*"

Outputs:
  WebhookEndpoint:
    Description: GitHub Webhook URL — paste this into GitHub App settings
    Value: !Sub 'https://${VibeGuardApi}.execute-api.${AWS::Region}.amazonaws.com/prod/webhook'
  VibeGuardWorkflowArn:
    Value: !Ref VibeGuardWorkflow
  AnalysisResultsTableName:
    Value: !Ref AnalysisResultsTable
  ExecutionLockTableName:
    Value: !Ref ExecutionLockTable
